name: chain-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runner chain
        run: |
          echo "runner=$RUNNER_OS arch=$RUNNER_ARCH sha=$GITHUB_SHA"
          test -n "$GITHUB_SHA"
      - name: Upload tiny artifact
        run: printf 'github-actions-chain-ok\n' > chain-smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chain-smoke
          path: chain-smoke.txt
